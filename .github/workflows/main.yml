name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        sudo ln -s $HOME/theos/bin/nic.pl /usr/local/bin/nic.pl
    - name: Build
      run: |
        export THEOS=$HOME/theos
        make package
        mkdir -p artifacts
        cp packages/*.deb artifacts/
    - name: Upload .deb
      uses: actions/upload-artifact@v4
      with:
        name: NewLOL
        path: artifacts/*.deb
