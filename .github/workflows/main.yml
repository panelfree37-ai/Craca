name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build with Theos
      uses: Randomblock1/theos-action@v1
    - name: Upload .deb
      uses: actions/upload-artifact@v3
      with:
        name: NewLOL
        path: packages/*.deb
