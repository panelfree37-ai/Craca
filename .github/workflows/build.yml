name: Build
on:
  push:
    paths:
      - 'Tweak.xm'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Theos
        uses: actions/checkout@v3
        with:
          repository: theos/theos
          path: theos
      - name: Build Tweak
        run: |
          export THEOS=$PWD/theos
          make package
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: packages/*.deb
